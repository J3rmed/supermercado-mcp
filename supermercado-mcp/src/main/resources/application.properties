spring.application.name=supermercado-mcp
server.address=127.0.0.1
server.port=${MCP_PORT:8089}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:55433/supermercado}
spring.datasource.username=${DB_USERNAME:supermercado}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

spring.ai.mcp.server.name=supermercado-mcp
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.stdio=false
spring.ai.mcp.server.streamable-http.mcp-endpoint=/mcp
spring.ai.mcp.server.capabilities.resource=false
spring.ai.mcp.server.capabilities.prompt=false
spring.ai.mcp.server.capabilities.completion=false
spring.ai.mcp.server.instructions=Gestiona catalogo y pedidos. Revisa exito en cada resultado. Confirma con el usuario antes de confirmar o cancelar pedidos. Los importes son COP y el domicilio es gratuito.
